name: saamago
description: "SAAMAgo borrowing and lending marketplace frontend demo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: "ic_saamago_icon"
  ios: false
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#0B0F24"
  adaptive_icon_foreground: "assets/app_icon.jpg"
